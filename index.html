<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>단국에 피는 붉은 꽃</title>
<style>
  :root {
    --bg: #0a0608;
    --red: #c0392b;
    --red-light: #e74c3c;
    --red-dim: rgba(192,57,43,0.08);
    --gold: #b8922a;
    --gold-light: #d4a843;
    --text: #e8ddd5;
    --text-dim: #9a8880;
    --border: rgba(184,146,42,0.22);
    --border-red: rgba(192,57,43,0.3);
    --music-h: 44px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Serif KR', 'NanumMyeongjo', Georgia, serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* 음악 바 */
  #music-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: var(--music-h);
    background: rgba(10,6,8,0.97);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 10px;
    z-index: 100;
    backdrop-filter: blur(8px);
  }
  .music-lotus {
    font-size: 17px;
    color: var(--red);
    animation: sway 4s ease-in-out infinite;
    flex-shrink: 0;
  }
  @keyframes sway { 0%,100%{transform:rotate(-5deg)} 50%{transform:rotate(5deg)} }
  .music-info { flex: 1; min-width: 0; }
  .music-title {
    font-size: 12px;
    color: var(--gold-light);
    letter-spacing: 0.08em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .music-sub { font-size: 10px; color: var(--text-dim); letter-spacing: 0.05em; }
  .music-progress-wrap {
    flex: 1.4;
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-width: 80px;
    max-width: 240px;
  }
  .music-track {
    height: 2px;
    background: rgba(255,255,255,0.07);
    border-radius: 2px;
    cursor: pointer;
    overflow: hidden;
  }
  .music-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--red), var(--gold));
    border-radius: 2px;
    width: 0%;
    transition: width 0.4s linear;
  }
  .music-time { font-size: 10px; color: var(--text-dim); text-align: right; font-family: monospace; }
  .mbtn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    width: 28px; height: 28px;
    border-radius: 50%;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .mbtn:hover { border-color: var(--red); color: var(--red-light); }
  .mbtn.play { width: 32px; height: 32px; border-color: var(--red); color: var(--red-light); font-size: 12px; }
  .vol-wrap { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
  .vol-icon { font-size: 11px; color: var(--text-dim); }
  input[type=range].vol-slider {
    -webkit-appearance: none; appearance: none;
    width: 56px; height: 2px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px; outline: none; cursor: pointer;
  }
  input[type=range].vol-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 10px; height: 10px;
    border-radius: 50%; background: var(--gold-light); cursor: pointer;
  }
  input[type=range].vol-slider::-moz-range-thumb {
    width: 10px; height: 10px;
    border-radius: 50%; background: var(--gold-light); border: none; cursor: pointer;
  }

  /* 스크롤 진행도 바 - 음악 바 바로 아래 */
  #progress-bar {
    position: fixed;
    top: var(--music-h);
    left: 0; right: 0;
    height: 3px;
    background: rgba(255,255,255,0.04);
    z-index: 99;
  }
  #progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--red), var(--gold));
    width: 0%;
    transition: width 0.1s;
    position: relative;
  }
  #progress-fill::after {
    content: '';
    position: absolute;
    right: -4px; top: -3px;
    width: 9px; height: 9px;
    background: var(--gold-light);
    border-radius: 50%;
  }

  /* 뷰어 - 음악바+진행도 바로 아래 */
  #viewer {
    margin-top: calc(var(--music-h) + 3px);
    max-width: 720px;
    margin-left: auto;
    margin-right: auto;
    padding-bottom: 120px;
  }

  /* 이미지 슬롯 30장 - 틈 없이 이어지게 */
  #webtoon-img {
    display: block;
    width: 100%;
    line-height: 0;
    background: #080406;
  }
  /* 이미지 보호 */
  .webtoon-slot {
    display: block;
    width: 100%;
    line-height: 0;
    position: relative;
    background: #080406;
    user-select: none;
    -webkit-user-select: none;
  }
  .webtoon-slot img {
    width: 100%;
    display: block;
    vertical-align: bottom;
    pointer-events: none;
    -webkit-user-drag: none;
    user-drag: none;
  }
  /* 이미지 위 투명 레이어로 드래그 차단 */
  .webtoon-slot::after {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 1;
  }

  .webtoon-slot.empty { display: none; }
  .ep-footer {
    padding: 48px 24px 40px;
    text-align: center;
    border-top: 1px solid var(--border);
  }
  .footer-lotus { font-size: 28px; color: var(--red); opacity: 0.35; margin-bottom: 24px; }

  .footer-series {
    font-size: 15px;
    letter-spacing: 0.14em;
    color: var(--text);
    margin-bottom: 6px;
  }
  .footer-credit {
    font-size: 11px;
    letter-spacing: 0.18em;
    color: var(--text-dim);
    margin-bottom: 32px;
  }
  .profile-btn {
    display: inline-flex; align-items: center; gap: 10px;
    background: none;
    border: 1px solid var(--red);
    color: var(--red-light);
    padding: 14px 36px;
    font-size: 14px; letter-spacing: 0.14em;
    cursor: pointer; font-family: inherit;
    border-radius: 2px;
    transition: all 0.3s;
    text-decoration: none;
    position: relative; overflow: hidden;
  }
  .profile-btn::before {
    content: '';
    position: absolute; inset: 0;
    background: var(--red-dim);
    transform: scaleX(0); transform-origin: left;
    transition: transform 0.3s;
  }
  .profile-btn:hover::before { transform: scaleX(1); }
  .profile-btn span, .profile-btn .pl { position: relative; z-index: 1; }

  /* 경고 배너 */
  #warn-banner {
    position: fixed;
    top: calc(var(--music-h) + 3px);
    left: 0; right: 0;
    background: rgba(10,6,8,0.96);
    border-bottom: 1px solid var(--border-red);
    padding: 10px 20px;
    text-align: center;
    z-index: 97;
    transition: opacity 0.4s, transform 0.4s;
  }
  #warn-banner.hide {
    opacity: 0;
    transform: translateY(-8px);
    pointer-events: none;
  }
  .warn-text {
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    line-height: 1.8;
  }
  .warn-text strong {
    color: var(--red-light);
    font-weight: 400;
  }
  #scroll-btns {
    position: fixed;
    bottom: 28px; right: 18px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    z-index: 90;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  #scroll-btns.show { opacity: 1; pointer-events: all; }
  .scroll-btn {
    width: 38px; height: 38px;
    background: rgba(10,6,8,0.92);
    border: 1px solid var(--border-red);
    color: var(--red);
    border-radius: 50%;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    transition: background 0.2s;
  }
  .scroll-btn:hover { background: var(--red-dim); }

  @media (max-width: 480px) {
    .music-progress-wrap { display: none; }
    .profile-btn { padding: 12px 24px; font-size: 13px; }
  }
</style>
</head>
<body>

<script>
  /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
     ★ 깃허브 경로 설정 (여기만 수정)
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
  const CONFIG = {
    // 이미지 30장 경로 - 비워두면 해당 슬롯 숨김
    IMAGES: [
      'https://img.ori030.uk/ori030/DA/1.webp',
      'https://img.ori030.uk/ori030/DA/2.webp',
      'https://img.ori030.uk/ori030/DA/3.webp',
      'https://img.ori030.uk/ori030/DA/4.webp',
      'https://img.ori030.uk/ori030/DA/5.webp',
      'https://img.ori030.uk/ori030/DA/6.webp',
      'https://img.ori030.uk/ori030/DA/7.webp',
      'https://img.ori030.uk/ori030/DA/8.webp',
      'https://img.ori030.uk/ori030/DA/9.webp',
      'https://img.ori030.uk/ori030/DA/10.webp',
      'https://img.ori030.uk/ori030/DA/11.webp',
      'https://img.ori030.uk/ori030/DA/12.webp',
      'https://img.ori030.uk/ori030/DA/13.webp',
      'https://img.ori030.uk/ori030/DA/14.webp',
      'https://img.ori030.uk/ori030/DA/15.webp',
      'https://img.ori030.uk/ori030/DA/16.webp',
      'https://img.ori030.uk/ori030/DA/17.webp',
      'https://img.ori030.uk/ori030/DA/18.webp',
      'https://img.ori030.uk/ori030/DA/19.webp',
      'https://img.ori030.uk/ori030/DA/20.webp',
      'https://img.ori030.uk/ori030/DA/21.webp',
      'https://img.ori030.uk/ori030/DA/22.webp',
      'https://img.ori030.uk/ori030/DA/23.webp',
      'https://img.ori030.uk/ori030/DA/24.webp',
      'https://img.ori030.uk/ori030/DA/25.webp',
      'https://img.ori030.uk/ori030/DA/26.webp',
      'https://img.ori030.uk/ori030/DA/27.webp',
      'https://img.ori030.uk/ori030/DA/28.webp',
      'https://img.ori030.uk/ori030/DA/29.webp',
      'https://img.ori030.uk/ori030/DA/30.webp',
    ],
    MUSIC_SRC: 'https://img.ori030.uk/ori030/DA/단피꽃노래.mp3',
    MUSIC_TITLE: '단국에 피어난 붉은 꽃',
    MUSIC_SUBTITLE: '단피꽃 OST',
    QUOTE_LINE1: '귀태라 불리던 아이가',
    QUOTE_LINE2: '기어이 왕이 되었구나',
    QUOTE_LINE3: '',
    PROFILE_URL: '#',
  };
</script>

<!-- 음악 바 -->
<div id="music-bar">
  <div class="music-lotus">❀</div>
  <div class="music-info">
    <div class="music-title" id="m-title"></div>
    <div class="music-sub" id="m-sub"></div>
  </div>
  <div class="music-progress-wrap">
    <div class="music-track" id="m-track">
      <div class="music-fill" id="m-fill"></div>
    </div>
    <div class="music-time" id="m-time">0:00 / 0:00</div>
  </div>
  <button class="mbtn play" id="btn-play">▶</button>
  <div class="vol-wrap">
    <span class="vol-icon">♪</span>
    <input type="range" class="vol-slider" id="vol-slider" min="0" max="1" step="0.01" value="0.5">
  </div>
  <audio id="audio" preload="metadata"></audio>
</div>

<!-- 스크롤 진행도 바 -->
<div id="progress-bar"><div id="progress-fill"></div></div>

<!-- 경고 배너 -->
<div id="warn-banner">
  <div class="warn-text">
    <strong>본 화에는 유혈 및 폭력적인 장면이 포함되어 있습니다.</strong><br>
    감상에 유의해 주세요.
  </div>
</div>

<!-- 뷰어 -->
<main id="viewer">
  <!-- 이미지 30장 슬롯 -->
  <div id="webtoon-img"></div>

  <!-- 하단 -->
  <div class="ep-footer">
    <div class="footer-lotus">❀</div>
    <div class="footer-series">단국에 피는 붉은 꽃</div>
    <div class="footer-credit">꽃오리</div>
    <a class="profile-btn" id="profile-link">
      <span class="pl">❀</span>
      <span>캐릭터 프로필 보러가기</span>
    </a>
  </div>
</main>

<!-- 스크롤 버튼 -->
<div id="scroll-btns">
  <button class="scroll-btn" id="btn-top">▲</button>
  <button class="scroll-btn" id="btn-bottom">▼</button>
</div>

<script>
  // 텍스트 적용
  document.getElementById('m-title').textContent = CONFIG.MUSIC_TITLE;
  document.getElementById('m-sub').textContent = CONFIG.MUSIC_SUBTITLE;
  document.getElementById('profile-link').addEventListener('click', e => {
    e.preventDefault();
    alert('곧 공개됩니다 🌸');
  });

  // 이미지 30장 슬롯 생성 - 틈 없이 이어지게
  const imgWrap = document.getElementById('webtoon-img');
  CONFIG.IMAGES.forEach((src, i) => {
    const slot = document.createElement('div');
    slot.className = 'webtoon-slot';
    if (!src) {
      slot.classList.add('empty');
    } else {
      const img = document.createElement('img');
      img.src = src;
      img.alt = (i+1) + '페이지';
      img.onerror = () => { slot.classList.add('empty'); };
      slot.appendChild(img);
    }
    imgWrap.appendChild(slot);
  });

  // 음악
  const audio = document.getElementById('audio');
  audio.src = CONFIG.MUSIC_SRC;
  const btnPlay = document.getElementById('btn-play');
  const mFill = document.getElementById('m-fill');
  const mTime = document.getElementById('m-time');
  const mTrack = document.getElementById('m-track');
  let playing = false;
  function fmt(s) {
    const m = Math.floor(s/60), sec = Math.floor(s%60);
    return m+':'+sec.toString().padStart(2,'0');
  }
  btnPlay.addEventListener('click', () => {
    if (playing) { audio.pause(); playing = false; btnPlay.textContent = '▶'; }
    else { audio.play(); playing = true; btnPlay.textContent = '❚❚'; }
  });
  audio.addEventListener('timeupdate', () => {
    if (!audio.duration) return;
    mFill.style.width = (audio.currentTime/audio.duration*100)+'%';
    mTime.textContent = fmt(audio.currentTime)+' / '+fmt(audio.duration);
  });
  audio.addEventListener('ended', () => { playing = false; btnPlay.textContent = '▶'; });
  mTrack.addEventListener('click', e => {
    if (!audio.duration) return;
    const r = mTrack.getBoundingClientRect();
    audio.currentTime = ((e.clientX-r.left)/r.width)*audio.duration;
  });

  // 볼륨
  const volSlider = document.getElementById('vol-slider');
  audio.loop = true;
  audio.volume = 0.5;
  // 자동재생 - 브라우저 정책상 사용자 첫 인터랙션 후 재생
  const tryAutoplay = () => {
    audio.play().then(() => {
      playing = true; btnPlay.textContent = '❚❚';
    }).catch(() => {});
  };
  tryAutoplay();
  // 자동재생 막힌 경우 첫 클릭/터치 시 재생
  const onFirst = () => {
    if (!playing) tryAutoplay();
    document.removeEventListener('click', onFirst);
    document.removeEventListener('touchstart', onFirst);
  };
  document.addEventListener('click', onFirst);
  document.addEventListener('touchstart', onFirst);
  volSlider.addEventListener('input', () => { audio.volume = parseFloat(volSlider.value); });

  // 이미지 보호
  document.addEventListener('contextmenu', e => {
    if (e.target.tagName === 'IMG' || e.target.closest('#webtoon-img')) e.preventDefault();
  });
  document.addEventListener('dragstart', e => {
    if (e.target.tagName === 'IMG') e.preventDefault();
  });
  document.addEventListener('keydown', e => {
    // Ctrl+S, Ctrl+U, F12, Ctrl+Shift+I/J/C
    if (
      (e.ctrlKey && (e.key === 's' || e.key === 'S' || e.key === 'u' || e.key === 'U')) ||
      e.key === 'F12' ||
      (e.ctrlKey && e.shiftKey && ['i','I','j','J','c','C'].includes(e.key))
    ) e.preventDefault();
  });
  const warnBanner = document.getElementById('warn-banner');
  const pFill = document.getElementById('progress-fill');
  const scrollBtns = document.getElementById('scroll-btns');
  window.addEventListener('scroll', () => {
    if (window.scrollY > 10) {
      warnBanner.classList.add('hide');
      if (!playing) tryAutoplay();
    } else warnBanner.classList.remove('hide');
    const doc = document.documentElement;
    const pct = doc.scrollHeight > doc.clientHeight
      ? (window.scrollY/(doc.scrollHeight-doc.clientHeight))*100 : 0;
    pFill.style.width = pct+'%';
    scrollBtns.classList.toggle('show', window.scrollY > 200);
  });
  document.getElementById('btn-top').addEventListener('click', () =>
    window.scrollTo({top:0,behavior:'smooth'}));
  document.getElementById('btn-bottom').addEventListener('click', () =>
    window.scrollTo({top:document.documentElement.scrollHeight,behavior:'smooth'}));
</script>
</body>
</html>
